[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crsi"
version = "0.1.0"
description = "Unofficial implementation of Self-Improvement Memory (SIM) for continual recursive self-improvement of agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["agents", "harness optimization", "recursive self-improvement", "memory", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
crsi = "crsi.cli:main"

[project.urls]
Repository = "https://github.com/aryehlev/crsi"
Paper = "https://arxiv.org/abs/2611.18856"

[tool.setuptools.packages.find]
include = ["crsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
